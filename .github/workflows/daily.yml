name: Daily AI news

on:
  schedule:
    # UTC 22:00 = 北京时间 06:00
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data issue en index.html archive.html search-index.json feed.xml .nojekyll styles.css app.js favicon.svg
          if git diff --cached --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "chore: 更新 $(TZ=Asia/Shanghai date +%Y-%m-%d) 的 AI 日报"
            git push
          fi

      - name: Stage site files
        run: |
          mkdir -p _site
          cp -r issue en _site/
          cp index.html archive.html search-index.json feed.xml .nojekyll styles.css app.js favicon.svg _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
